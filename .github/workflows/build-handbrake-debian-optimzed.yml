name: Build HandBrakeCLI on Debian AVX-512

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - main2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - run: df -h
      
      - name: "node-cleanup"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a
          
      - run: df -h
      
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable BuildKit
        run: echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create a builder with larger log size
        run: |
            docker buildx create --use --name larger_log --driver-opt env.BUILDKIT_STEP_LOG_MAX_SIZE=50000000
      
      - name: Restore buildx cache
        uses: actions/cache@v4
        with:
          path: .buildx-cache
          key: buildxB-cache-${{ runner.os }}-${{ hashFiles('Dockerfile.debian','build-handbrake-debian.sha') }}
          restore-keys: buildxB-cache-${{ runner.os }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build GCC 15 image
        run: |
          IMAGE=ghcr.io/rokavolgy/handbrake:gcc15-slim-fit
          if docker pull "$IMAGE"; then
            echo "Pulled $IMAGE"
            docker tag "$IMAGE" handbrake-al2023:gcc15-slim-fit
          else
            echo "$IMAGE not found, building prepare stage and pushing to registry"
            mkdir -p .buildx-cache
            docker buildx build \
              --progress=plain \
              --file Dockerfile.debian \
              --tag "$IMAGE" \
              --cache-from=type=registry,ref=ghcr.io/rokavolgy/handbrake:cache \
              --cache-to=type=registry,ref=ghcr.io/rokavolgy/handbrake:cache,mode=max \
              --target prepare \
              --push \
              .
            docker pull "$IMAGE"
            docker tag "$IMAGE" handbrake-al2023:gcc15-slim-fit
          fi
          
      - name: Build HandBrakeCLI
        run: | 
              docker buildx build \
              --progress=plain \
              --file Dockerfile.debian \
              --tag "ghcr.io/rokavolgy/handbrake:compiled" \
              --build-arg AVX-512=TRUE \
              --cache-from=type=image,ref=ghcr.io/rokavolgy/handbrake:prepare \
              --cache-from=type=registry,ref=ghcr.io/rokavolgy/handbrake:cache \
              --cache-to=type=registry,ref=ghcr.io/rokavolgy/handbrake:cache,mode=max \
              --load \
              --push \
              .

      - name: Create container
        run: docker create --name handbrake-build ghcr.io/rokavolgy/handbrake:compiled
      
      - name: Copy HandBrakeCLI
        run: |
          mkdir -p output
          docker cp handbrake-build:/usr/local/bin/HandBrakeCLI output/HandBrakeCLI
      
      - name: Remove container
        run: docker rm handbrake-build

      - name: Upload HandBrakeCLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: HandBrakeCLI
          path: output/HandBrakeCLI
